# The Train Schedule app on Kubernetes. Jenkins replaces $DOCKER_IMAGE_NAME and
# $BUILD_NUMBER with this build's image and applies the file on every build.
kind: Service
apiVersion: v1
metadata:
  name: train-schedule-service
spec:
  type: NodePort
  selector:
    app: train-schedule
  ports:
  - protocol: TCP
    port: 8080
    nodePort: 30080       # NodePorts must be in 30000-32767

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: train-schedule-deployment
  labels:
    app: train-schedule
spec:
  # No "replicas" here: the HorizontalPodAutoscaler below sets the pod count,
  # and a fixed number would reset it on every deploy
  selector:
    matchLabels:
      app: train-schedule
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1         # start one new pod at a time
      maxUnavailable: 0   # never drop below the current pod count
  template:
    metadata:
      labels:
        app: train-schedule
    spec:
      containers:
      - name: train-schedule
        image: $DOCKER_IMAGE_NAME:$BUILD_NUMBER
        ports:
        - containerPort: 8080
        readinessProbe:   # receives traffic only once the page loads
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:    # restarted if the page stops loading
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          timeoutSeconds: 2
          periodSeconds: 10
        resources:
          requests:       # the HPA's CPU percentage is measured against this
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: train-schedule-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: train-schedule-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50   # add pods when average CPU passes 50% of the request
